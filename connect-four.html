<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#ddd6c8;--accent:#1d7bd8;--soft:#eee8dc;--good:#2a9d4a;--warn:#f4a300;--bad:#d64545;--sh:0 4px 14px rgba(0,0,0,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit;background:none}
button:disabled{opacity:.35;cursor:not-allowed}
[hidden]{display:none!important}
#setup{max-width:520px;margin:6vh auto;padding:32px;background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
#setup h1{margin:0 0 4px;font-size:2.2rem}
#setup>p{margin:0 0 20px;color:var(--muted)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;font-size:1.15rem;font-weight:600}
.field.col{display:block}
.stepper{display:flex;align-items:center;gap:8px;flex-shrink:0}
.stepper button{width:44px;height:44px;font-size:1.5rem;background:var(--soft)}
.stepper input{width:70px;height:44px;text-align:center;font-size:1.3rem;font-weight:700;border:2px solid var(--line);border-radius:10px;font-family:inherit}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:9px 12px;font-size:.98rem;font-weight:600}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.big{width:100%;padding:16px;margin-top:18px;font-size:1.25rem;font-weight:700;background:var(--accent);color:#fff}
.ghost{width:100%;padding:12px;margin-top:10px;font-size:1rem;background:var(--soft)}
.how{margin-top:18px;color:var(--muted);font-size:.98rem;line-height:1.45}
.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
#game{padding:16px 20px 30px}
#game>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#game>header h1{margin:0;font-size:1.6rem;margin-right:auto}
#game>header button,.btn{padding:10px 16px;font-weight:600;background:#fff;border:2px solid var(--line);border-radius:10px}
#banner{padding:12px 18px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:1.2rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:58px}
#banner .msg{margin-right:auto}
#banner.pick{background:#fff7d6;border-color:var(--warn)}
#banner.win{background:#e3f6e8;border-color:var(--good)}
#banner.alert{background:#fde8e8;border-color:var(--bad)}
#banner button{padding:8px 14px;background:#fff;border:2px solid var(--line);font-weight:600}
.tname{padding:0;font-weight:700;text-align:left}
.tname:hover{text-decoration:underline dotted}
.tlabel{white-space:nowrap}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--c);vertical-align:-.05em;margin-right:.35em}
.ok{background:var(--good);color:#fff;font-weight:700}
.no{background:var(--bad);color:#fff;font-weight:700}
.adj{background:var(--soft);font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.teamlist{display:flex;flex-direction:column;gap:10px}
.trow{background:#fff;border-radius:14px;padding:12px 14px;border:3px solid transparent;border-left:10px solid var(--c);box-shadow:var(--sh);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.trow .thead .tname{font-size:1.2rem}
.trow .score{font-size:2rem;font-weight:800;line-height:1}
.trow .sub{grid-column:1/-1;color:var(--muted);font-size:.95rem}
.trow .tbtns{grid-column:1/-1;display:flex;gap:6px;margin-top:4px}
.trow .tbtns .ok{flex:1;padding:12px}
.trow.active{border-color:var(--good);border-left-color:var(--c)}
.trow.lead .score::before{content:"👑 ";font-size:1.1rem}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .45s ease}.shake{animation:shake .35s ease}
/* ----- Buzz-in panel ----- */
#buzz:empty{display:none}
.bz{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.bz.off{background:transparent;border-style:dashed}
.bz.alertbz{background:#fde8e8;border-color:var(--bad)}
.bz button,.bz .btn{padding:8px 12px;font-weight:600;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:.95rem}
.bz .bzon{background:var(--accent);color:#fff;border-color:var(--accent)}
.bzhint{color:var(--muted);flex:1;min-width:200px}
.bz.alertbz .bzhint{color:var(--ink)}
.bzcode{display:flex;flex-direction:column;line-height:1.1;padding-right:12px;border-right:2px solid var(--line)}
.bzcode span{font-size:.8rem;color:var(--muted);font-weight:600}
.bzcode b{font-size:2rem;letter-spacing:.12em;font-family:ui-monospace,Menlo,Consolas,monospace}
.bzcode small{color:var(--muted);font-size:.8rem}
.bzline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.bzempty{color:var(--muted);font-weight:600}
.bzfront{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:12px;background:#e3f6e8;border:3px solid var(--c);font-size:1.15rem}
.bzfront small{color:var(--muted);font-size:.85rem}
.bz .bzfront .ok,.bz .bzfront .no{border:0;color:#fff;padding:10px 14px}
.bz .bzfront .ok{background:var(--good)}.bz .bzfront .no{background:var(--bad)}
.bzchip{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;border-radius:999px;background:#f3efe6;border:2px solid var(--c);font-weight:600}
.bzchip.wait{opacity:.75;border-style:dashed}
.bzchip small{color:var(--muted)}
.bzpos{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:800}
.bzpos.sm{width:22px;height:22px;font-size:.8rem}
.bz .bzx{border:0;background:transparent;color:var(--muted);font-size:1.2rem;padding:2px 8px}
.bz .bzlet{padding:3px 8px;font-size:.8rem}
.bz .bzundo{border-style:dashed;color:var(--muted)}
.bztools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bzlive{color:var(--good);font-weight:700;font-size:.85rem}
.bzwarn{color:var(--bad);font-weight:700;font-size:.85rem}
.filebtn{position:relative;display:inline-block;cursor:pointer;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.c4wrap{margin:0 auto}
.c4arrows{display:grid;gap:8px;padding:0 12px;margin-bottom:4px}
.arrow{font-size:1.6rem;padding:4px 0;color:var(--muted)}
.arrow:disabled{opacity:.12}
.c4{display:grid;gap:8px;background:#2459c9;padding:12px;border-radius:18px;box-shadow:0 6px 18px rgba(36,89,201,.3)}
.hole{aspect-ratio:1;border-radius:50%;background:#fff;position:relative;padding:0;cursor:default;box-shadow:inset 0 3px 6px rgba(0,0,0,.2)}
.hole.can{cursor:pointer}
.hole.can:hover{background:#fff7d6}
.chip{position:absolute;inset:6%;border-radius:50%;background:var(--chip);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.chip.drop{animation:drop .4s cubic-bezier(.45,0,.8,.5)}
@keyframes drop{from{transform:translateY(calc(var(--r) * -112%))}to{transform:translateY(0)}}
.hole.win .chip{box-shadow:0 0 0 5px #fff,0 0 0 9px #1f2328;animation:pop .6s ease 2}

</style>
</head>
<body>
<div id="setup">
  <h1 class="gtitle"></h1>
  <p id="tagline"></p>
  <div id="fields"></div>
  <button class="big" id="startBtn">Start game</button>
  <button class="ghost" id="resumeBtn" hidden>Resume saved game</button>
  <details class="how" id="how"></details>
</div>
<div id="game" hidden>
  <header><h1 class="gtitle"></h1><button id="undoBtn">↶ Undo</button><button id="newBtn">New game</button></header>
  <div id="banner"></div>
  <div id="buzz"></div>
  <div id="board"></div>
</div>
<script>
const GAME={
key:'connect4',title:'Connect Four',emoji:'🔴',
tagline:'Right answer? Drop a chip.',
how:`<p>Tap <b>✓ Correct</b> for the team that answered right, then tap a column to drop their chip. The first team to line up four in a row (across, down, or diagonal) wins the round.</p><p>Press <b>Next round</b> to clear the board. Round wins are kept for each team.</p>`,
options:[
  {id:'teams',label:'Teams',min:2,max:4,def:2},
  {id:'size',label:'Board',type:'seg',def:'7x6',choices:[['7x6','7 × 6'],['9x7','9 × 7']]}
],
init(o){const[c,r]=o.size.split('x').map(Number);return{cols:c,rows:r,grid:Array(c*r).fill(-1),wins:S.teams.map(()=>0),over:null}},
render(){
  const t=UI.team,picking=t!=null&&!S.over,C=S.cols,R=S.rows;
  if(S.over)banner(S.over.draw?'🤝 The board is full. No winner this round.':`🎉 ${tb(S.over.winner)} connected four!`,'win',nextBtn);
  else if(picking)banner(`✅ ${tb(t)} got it! Tap a column to drop a chip.`,'pick',cancelBtn);
  else banner('Tap <b>✓ Correct</b> on the team that answered right.');
  const win=new Set(S.over&&S.over.cells||[]);
  let cells='';
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const k=r*C+c,o=S.grid[k],open=S.grid[c]===-1;
    cells+=`<button class="hole ${picking&&open?'can':''} ${win.has(k)?'win':''}" data-act="col" data-c="${c}">${o>=0?`<span class="chip ${FX.k===k?'drop':''}" style="--chip:${tc(o)};--r:${r+1}"></span>`:''}</button>`;
  }
  const arrows=Array.from({length:C},(_,c)=>`<button class="arrow" data-act="col" data-c="${c}" ${picking&&S.grid[c]===-1?'':'disabled'} style="${picking?`color:${tc(t)}`:''}">▼</button>`).join('');
  const L=leaders(S.wins);
  const teams=S.teams.map((_,i)=>`<div class="trow ${t===i?'active':''} ${L[i]?'lead':''}" style="--c:${tc(i)}"><div class="thead">${tn(i)}</div><div class="score">${S.wins[i]}</div><div class="sub">round${S.wins[i]===1?'':'s'} won</div><div class="tbtns"><button class="ok" data-act="correct" data-i="${i}" ${S.over?'disabled':''}>✓ Correct</button></div></div>`).join('');
  $('board').innerHTML=`<div class="layout"><div class="c4wrap" style="width:min(100%,calc(66vh * ${C} / ${R}))"><div class="c4arrows" style="grid-template-columns:repeat(${C},1fr)">${arrows}</div><div class="c4" style="grid-template-columns:repeat(${C},1fr)">${cells}</div></div><div class="teamlist">${teams}</div></div>`;
},
click(a,el){
  if(a==='correct'){if(!S.over)ui({team:+el.dataset.i});}
  else if(a==='col'){
    const t=UI.team;if(t==null||S.over)return;
    const c=+el.dataset.c,C=S.cols;let r=-1;
    for(let rr=S.rows-1;rr>=0;rr--)if(S.grid[rr*C+c]===-1){r=rr;break;}
    if(r<0)return;
    act(()=>{const k=r*C+c;S.grid[k]=t;FX.k=k;const line=c4Four(r,c,t);
      if(line){S.over={winner:t,cells:line};S.wins[t]++;}
      else if(S.grid.every(x=>x>=0))S.over={draw:true};});
  }
  else if(a==='next')act(()=>{S.grid=S.grid.map(()=>-1);S.over=null;});
}};
function c4Four(r,c,t){
  const C=S.cols,R=S.rows,g=S.grid;
  for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){
    const cells=[r*C+c];
    for(const s of[1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<R&&cc>=0&&cc<C&&g[rr*C+cc]===t){cells.push(rr*C+cc);rr+=dr*s;cc+=dc*s;}}
    if(cells.length>=4)return cells;
  }
  return null;
}

// ===== Shared engine =====
const COLORS=['#e63946','#1d7bd8','#2a9d4a','#f4a300','#8e44ad','#e76f51','#0fa3b1','#d63384','#5a3e2b','#3a86ff','#80b918','#6c757d'];
const MARKS=['✕','◯','▲','■'];
const $=id=>document.getElementById(id);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(Number(v)||lo)));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='classgame-'+GAME.key+'-v1';
const cancelBtn='<button data-act="cancel">Cancel</button>';
const nextBtn='<button data-act="next">Next round ▶</button>';
let S=null,H=[],UI={},FX={};
const OPTS={};
// Buzz-in hand-off: QPEND is the team the line just sent up. When that team's reward is committed
// (the next act), the buzz-in panel takes them out of the line.
let QPEND=null,QDID=false;

function save(){try{localStorage.setItem(KEY,JSON.stringify({S,H}))}catch(e){try{localStorage.setItem(KEY,JSON.stringify({S,H:H.slice(-15)}))}catch(e2){}}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.S&&Array.isArray(d.S.teams)&&d.S.teams.length)return d}catch(e){}return null}
// Every scoring change goes through act(): it snapshots the state first so Undo can restore it.
function act(fn,keepUI){
  const before=JSON.stringify(S);if(fn()===false)return;
  H.push(before);if(H.length>200)H.shift();if(!keepUI)UI={};
  QDID=true;if(QPEND!=null){const t=QPEND;QPEND=null;if(window.BZ)BZ.served(t);}
  save();draw();
}
function undo(){
  if(!H.length)return;
  const names=S.teams.map(t=>t.name),kept={};(GAME.keep||[]).forEach(k=>kept[k]=S[k]);
  S=JSON.parse(H.pop());
  S.teams.forEach((t,i)=>{if(names[i]!=null)t.name=names[i]});           // renames survive undo
  (GAME.keep||[]).forEach(k=>{if(kept[k]!==undefined)S[k]=kept[k]});
  UI={};FX={};QPEND=null;save();draw();
}
function ui(o){UI=o||{};if(!Object.keys(UI).length)QPEND=null;draw();}
function draw(){$('undoBtn').disabled=!H.length;GAME.render();FX={};if(window.BZ)BZ.render();}
function banner(msg,cls,btns){const b=$('banner');b.className=cls||'';b.innerHTML='<span class="msg">'+msg+'</span>'+(btns||'');}
function tc(i){return COLORS[i%COLORS.length]}
function tn(i){return `<button class="tname" data-rename="${i}" title="Click to rename" style="--c:${tc(i)}"><span class="dot"></span>${esc(S.teams[i].name)}</button>`}
function tb(i){return `<b class="tlabel" style="--c:${tc(i)}"><span class="dot"></span>${esc(S.teams[i].name)}</b>`}
function leaders(arr){const m=Math.max(...arr),tied=arr.every(v=>v===m);return arr.map(v=>m>0&&v===m&&!tied)}
function winnerText(arr){const m=Math.max(...arr);const w=arr.map((v,i)=>v===m?i:-1).filter(i=>i>=0);return w.length===1?`${tb(w[0])} wins! 🎉`:`It's a tie: ${w.map(tb).join(' & ')}!`}

// ----- Buzz-in hooks (the panel itself lives in the buzz module) -----
// Called by the line's ✓ Correct button. Runs the game's normal "this team got it right" step.
function buzzCorrect(i){
  if(Object.keys(UI).length){UI={};draw();}
  QPEND=i;QDID=false;
  if(GAME.correct)GAME.correct(i);else GAME.click('correct',{dataset:{i:String(i)}});
  if(!QDID&&!Object.keys(UI).length)QPEND=null;   // the game refused (e.g. round over); team stays in line
  if(window.BZ)BZ.render();
}
function buzzWrong(i){if(GAME.wrong)GAME.wrong(i);}
function buzzAllowed(){return !(GAME.noBuzz&&GAME.noBuzz())}

// ----- Setup screen -----
function buildSetup(){
  const f=$('fields');f.innerHTML='';
  GAME.options.forEach(o=>{
    const row=document.createElement('div');row.className='field';
    if(o.type==='seg'){OPTS[o.id]=o.def;row.innerHTML=`<span>${o.label}</span><div class="seg">${o.choices.map(c=>`<button data-opt="${o.id}" data-val="${c[0]}" class="${c[0]===o.def?'on':''}">${c[1]}</button>`).join('')}</div>`;}
    else if(o.type==='html'){row.className='field col';row.innerHTML=o.html;}
    else row.innerHTML=`<span>${o.label}</span><div class="stepper"><button data-step="${o.id}" data-d="-1">−</button><input id="opt_${o.id}" type="number" min="${o.min}" max="${o.max}" value="${o.def}"><button data-step="${o.id}" data-d="1">+</button></div>`;
    f.appendChild(row);
  });
}
function readOpts(){const o={};GAME.options.forEach(x=>{if(x.type==='seg')o[x.id]=OPTS[x.id];else if(x.type!=='html')o[x.id]=clamp($('opt_'+x.id).value,x.min,x.max);});return o;}
$('setup').addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');
  if(st){const o=GAME.options.find(x=>x.id===st.dataset.step),inp=$('opt_'+o.id);inp.value=clamp(+inp.value+ +st.dataset.d,o.min,o.max);return;}
  const sg=e.target.closest('[data-opt]');
  if(sg){OPTS[sg.dataset.opt]=sg.dataset.val;sg.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));}
});
$('startBtn').onclick=async()=>{
  const o=readOpts();
  if(GAME.beforeStart&&!(await GAME.beforeStart(o)))return;
  const n=o.teams||GAME.fixedTeams||2;
  S={teams:Array.from({length:n},(_,i)=>({name:'Team '+(i+1)})),o};
  Object.assign(S,GAME.init(o));
  H=[];UI={};FX={};QPEND=null;save();
  if(window.BZ)BZ.newGame();
  showGame();
};
$('resumeBtn').onclick=()=>{const d=load();if(!d)return;S=d.S;H=Array.isArray(d.H)?d.H:[];UI={};FX={};QPEND=null;if(GAME.onResume)GAME.onResume();showGame();if(window.BZ)BZ.resume();};
function showGame(){$('setup').hidden=true;$('game').hidden=false;window.scrollTo(0,0);draw();}
function showSetup(){$('game').hidden=true;$('setup').hidden=false;$('resumeBtn').hidden=!load();}

// ----- Game screen -----
$('undoBtn').onclick=undo;
$('newBtn').onclick=()=>{if(confirm('End this game and go back to setup?')){if(window.BZ)BZ.end();showSetup();}};
document.addEventListener('keydown',e=>{
  if($('game').hidden)return;
  if(e.key==='Escape'&&Object.keys(UI).length)ui({});
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
});
$('game').addEventListener('click',e=>{
  const r=e.target.closest('[data-rename]');
  if(r&&!Object.keys(UI).length){
    const i=+r.dataset.rename,n=prompt('Team name:',S.teams[i].name);
    if(n&&n.trim()){S.teams[i].name=n.trim().slice(0,30);save();draw();if(window.BZ)BZ.teamsChanged();}
    return;
  }
  const a=e.target.closest('[data-act]');
  if(!a||a.disabled)return;
  if(a.dataset.act==='cancel'){ui({});return;}
  GAME.click(a.dataset.act,a,e);
});

document.title=GAME.title;
document.querySelectorAll('.gtitle').forEach(h=>h.textContent=GAME.emoji+' '+GAME.title);
$('tagline').textContent=GAME.tagline;
$('how').innerHTML='<summary>How to play</summary>'+GAME.how+'<p><b>Buzz-in:</b> turn it on from the game screen. Each group opens this site on one computer, taps <b>Students: Buzz in</b>, types the code, and picks their team. Their buzzes line up on your screen in order.</p>';
buildSetup();
if(GAME.setupInit)GAME.setupInit();
if(load())$('resumeBtn').hidden=false;

</script>
<script type="module">
// Firebase: the same project as Hall Pass. Games live in their own "buzz" section of the database,
// which never touches Hall Pass's data. These settings aren't passwords; the security rules protect the data.
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, doc, collection, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCeHZwTuSiQRtfhuAOoqKRVX_bs12U0SV4",
  authDomain: "hall-pass-5cf96.firebaseapp.com",
  projectId: "hall-pass-5cf96",
  storageBucket: "hall-pass-5cf96.firebasestorage.app",
  messagingSenderId: "483428602738",
  appId: "1:483428602738:web:d403721361c5d911b9c3eb"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
// Long polling gets through school web filters that block Firebase's normal streaming connection.
const db = initializeFirestore(fbApp, { experimentalForceLongPolling: true });
const roomRef = code => doc(db, 'buzz', code);
const pressCol = code => collection(db, 'buzz', code, 'presses');
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

// ===== Buzz-in line: the teacher's side =====
// Students' computers can only drop a "press" (join or leave) into the room. This screen is the only
// thing that writes the line itself, so order is decided in one place, by Firebase's server clock.
const BZKEY = 'classgame-' + GAME.key + '-buzz';
const CODECH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // no 0/O or 1/I/L
let R = null;          // live room: {code, queue:[{team,dev,n}], cool, coolOn, last}
let R_state = 'off';   // off | signin | connecting | on | error
let R_err = '', R_undo = null, R_unsub = null, R_chime = lsGet('classgame-chime') !== 'off', R_wasFront = false;

const studentURL = () => location.host + location.pathname.replace(/[^/]*$/, '');

function frontIndex() {
  if (!R) return -1;
  return R.queue.findIndex(q => !(R.coolOn && q.team === R.cool));
}

async function ensureAuth() {
  await new Promise(r => { const u = onAuthStateChanged(auth, () => { u(); r(); }); });
  if (auth.currentUser) return true;
  for (const k of ['hp-teacher-key', 'cg-teacher-key']) {
    let key = null; try { key = JSON.parse(lsGet(k) || 'null'); } catch (e) {}
    if (key && key.email && key.password) {
      try { await signInWithEmailAndPassword(auth, key.email, key.password); return true; } catch (e) {}
    }
  }
  return false;
}

async function turnOn(resumeCode) {
  if (!buzzAllowed()) return;
  R_state = 'connecting'; R_err = ''; bzRender();
  try {
    if (!(await ensureAuth())) { R_state = 'signin'; bzRender(); return; }
    let code = resumeCode, snap = null;
    if (code) {
      snap = await getDoc(roomRef(code));
      if (!snap.exists() || snap.data().ownerUid !== auth.currentUser.uid) { code = null; snap = null; }
    }
    if (!code) {
      for (let t = 0; t < 8 && !code; t++) {
        const c = Array.from(crypto.getRandomValues(new Uint8Array(4)), b => CODECH[b % CODECH.length]).join('');
        if (!(await getDoc(roomRef(c))).exists()) code = c;
      }
      if (!code) throw new Error('Could not make a room code.');
      R = { code, queue: [], cool: -1, coolOn: GAME.buzzCool !== false, last: null };
      await setDoc(roomRef(code), { ownerUid: auth.currentUser.uid, game: GAME.title, teams: teamList(),
        queue: [], cool: -1, coolOn: R.coolOn, last: null, created: serverTimestamp() });
    } else {
      const d = snap.data();
      R = { code, queue: d.queue || [], cool: d.cool ?? -1, coolOn: d.coolOn !== false, last: d.last || null };
      await updateDoc(roomRef(code), { teams: teamList(), game: GAME.title });
    }
    lsSet(BZKEY, code);
    listen(code);
    R_state = 'on'; R_wasFront = frontIndex() >= 0;
  } catch (e) {
    console.error(e); R_state = 'error';
    R_err = /permission/i.test(String(e && (e.code || e.message))) ? "Firebase said no. Check that the new rules were published." : "Can't reach Firebase right now.";
  }
  bzRender();
}

function listen(code) {
  if (R_unsub) R_unsub();
  let busy = Promise.resolve();
  R_unsub = onSnapshot(pressCol(code), snap => {
    const adds = snap.docChanges().filter(c => c.type === 'added')
      .map(c => ({ id: c.doc.id, ...c.doc.data() }))
      .sort((a, b) => ms(a.at) - ms(b.at));
    if (!adds.length) return;
    busy = busy.then(() => handlePresses(code, adds));
  }, e => { console.error(e); R_state = 'error'; R_err = 'Lost the connection to Firebase.'; bzRender(); });
}
const ms = t => (t && t.toMillis) ? t.toMillis() : Number.MAX_SAFE_INTEGER;

async function handlePresses(code, presses) {
  if (!R || R.code !== code) return;
  let changed = false;
  for (const p of presses) {
    const t = p.team;
    if (!Number.isInteger(t) || t < 0 || t >= S.teams.length) continue;
    const at = R.queue.findIndex(q => q.team === t);
    if (p.action === 'join' && at < 0) { R.queue.push({ team: t, dev: p.device || '', n: 0 }); changed = true; }
    if (p.action === 'leave' && at >= 0 && R.queue[at].dev === p.device) { R.queue.splice(at, 1); changed = true; }
  }
  if (changed) await push();
  bzRender();
  for (const p of presses) { try { await deleteDoc(doc(db, 'buzz', code, 'presses', p.id)); } catch (e) {} }
}

async function push() {
  if (!R) return;
  try {
    await updateDoc(roomRef(R.code), { queue: R.queue, cool: R.cool, coolOn: R.coolOn, last: R.last });
    if (R_state === 'error') { R_state = 'on'; R_err = ''; bzRender(); }
  } catch (e) { console.error(e); R_state = 'error'; R_err = "Couldn't save the line. Check the internet connection."; bzRender(); }
}
const teamList = () => S.teams.map((t, i) => ({ name: t.name, color: tc(i) }));

// ---- actions ----
function served(team) {
  if (!R) return;
  const at = R.queue.findIndex(q => q.team === team);
  R_undo = { entry: at >= 0 ? R.queue[at] : null, index: at, cool: R.cool, team };
  if (at >= 0) R.queue.splice(at, 1);
  R.cool = team; R.last = { team, r: 'ok', t: Date.now() };
  push(); bzRender();
}
function notYet(team) {
  const at = R.queue.findIndex(q => q.team === team); if (at < 0) return;
  const [q] = R.queue.splice(at, 1); q.n = (q.n || 0) + 1; R.queue.push(q);
  R.last = { team, r: 'no', t: Date.now() }; R_undo = null;
  buzzWrong(team); push(); bzRender();
}
function remove(team) {
  const at = R.queue.findIndex(q => q.team === team); if (at < 0) return;
  R.queue.splice(at, 1); R_undo = null; push(); bzRender();
}
function putBack() {
  if (!R_undo) return;
  const u = R_undo; R_undo = null;
  if (u.entry && !R.queue.some(q => q.team === u.team)) R.queue.splice(Math.max(0, Math.min(u.index, R.queue.length)), 0, u.entry);
  R.cool = u.cool; push(); bzRender();
}
async function end() {
  if (R_unsub) { R_unsub(); R_unsub = null; }
  const code = R ? R.code : lsGet(BZKEY);
  R = null; R_state = 'off'; R_undo = null; lsSet(BZKEY, null);
  if (code) { try { await ensureAuth(); await deleteDoc(roomRef(code)); } catch (e) {} }
  bzRender();
}

function chime() {
  if (!R_chime) return;
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)(), o = A.createOscillator(), g = A.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, A.currentTime); o.frequency.setValueAtTime(1175, A.currentTime + .12);
    g.gain.setValueAtTime(.0001, A.currentTime); g.gain.exponentialRampToValueAtTime(.25, A.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + .45);
    o.connect(g); g.connect(A.destination); o.start(); o.stop(A.currentTime + .5);
  } catch (e) {}
}

// ---- panel ----
function bzRender() {
  const el = $('buzz'); if (!el) return;
  if ($('game').hidden || !S || !buzzAllowed()) { el.innerHTML = ''; el.className = ''; return; }
  if (R_state === 'off') {
    el.className = 'bz off';
    el.innerHTML = `<button class="bzon" data-bz="on">📣 Turn on buzz-in</button><span class="bzhint">Groups signal from their computers when they have an answer, and line up here in order.</span>`;
    return;
  }
  if (R_state === 'connecting') { el.className = 'bz off'; el.innerHTML = '<span class="bzhint">Connecting buzz-in…</span>'; return; }
  if (R_state === 'signin') {
    el.className = 'bz alertbz';
    el.innerHTML = `<span class="bzhint"><b>Buzz-in uses your Hall Pass teacher key.</b> Open Hall Pass on this computer once, then try again, or load your Hall Pass backup file.</span>
      <button data-bz="on">Try again</button><label class="btn filebtn">Load backup file<input type="file" accept=".json,application/json" data-bzfile></label><button data-bz="off">Cancel</button>`;
    return;
  }
  if (!R) { el.className = 'bz alertbz'; el.innerHTML = `<span class="bzhint">⚠️ ${esc(R_err)}</span><button data-bz="on">Try again</button><button data-bz="off">Turn off</button>`; return; }
  const f = frontIndex(), busy = Object.keys(UI).length > 0 || QPEND != null;
  if (f >= 0 && !R_wasFront) chime();
  R_wasFront = f >= 0;
  const name = t => S.teams[t] ? esc(S.teams[t].name) : 'Team ' + (t + 1);
  let line = '';
  if (!R.queue.length) line = '<span class="bzempty">No one in line yet.</span>';
  else {
    let pos = 0;
    line = R.queue.map((q, k) => {
      const waiting = R.coolOn && q.team === R.cool;
      if (k === f) {
        pos++;
        return `<div class="bzfront" style="--c:${tc(q.team)}"><span class="bzpos">1</span><b>${name(q.team)}</b>${q.n ? `<small>try ${q.n + 1}</small>` : ''}
          <button class="ok" data-bz="ok" data-t="${q.team}" ${busy ? 'disabled' : ''}>✓ Correct</button>
          <button class="no" data-bz="no" data-t="${q.team}" ${busy ? 'disabled' : ''}>✗ Not yet</button>
          <button class="bzx" data-bz="rm" data-t="${q.team}" title="Take out of line">×</button></div>`;
      }
      if (waiting) return `<div class="bzchip wait" style="--c:${tc(q.team)}"><span class="dot"></span>${name(q.team)} <small>waits: scored last</small>
        <button class="bzlet" data-bz="let">Let them go</button><button class="bzx" data-bz="rm" data-t="${q.team}">×</button></div>`;
      pos++;
      return `<div class="bzchip" style="--c:${tc(q.team)}"><span class="bzpos sm">${pos}</span>${name(q.team)}<button class="bzx" data-bz="rm" data-t="${q.team}" title="Take out of line">×</button></div>`;
    }).join('');
  }
  const undoChip = R_undo ? `<button class="bzundo" data-bz="putback">↩ Put ${name(R_undo.team)} back in line</button>` : '';
  el.className = 'bz';
  el.innerHTML = `<div class="bzcode"><span>Buzz-in code</span><b>${R.code}</b><small>${esc(studentURL())}</small></div>
    <div class="bzline">${line}${undoChip}</div>
    <div class="bztools">${R_state === 'error' ? `<span class="bzwarn" title="${esc(R_err)}">⚠️ Offline</span>` : '<span class="bzlive">● Live</span>'}
      <button data-bz="cool" title="When on, a team that just scored waits until another team scores">${R.coolOn ? '✓' : '○'} No back-to-back</button>
      <button data-bz="chime" title="Sound when a team reaches the front">${R_chime ? '🔔' : '🔕'}</button>
      <button data-bz="off">Turn off</button></div>`;
}

$('buzz').addEventListener('click', e => {
  const b = e.target.closest('[data-bz]'); if (!b || b.disabled) return;
  const a = b.dataset.bz, t = +b.dataset.t;
  if (a === 'on') turnOn(lsGet(BZKEY));
  else if (a === 'off') { if (R_state !== 'on' || confirm('Turn off buzz-in? Groups will need the new code if you turn it back on.')) end(); }
  else if (a === 'ok') buzzCorrect(t);
  else if (a === 'no') notYet(t);
  else if (a === 'rm') remove(t);
  else if (a === 'let') { R.cool = -1; push(); bzRender(); }
  else if (a === 'putback') putBack();
  else if (a === 'cool') { R.coolOn = !R.coolOn; push(); bzRender(); }
  else if (a === 'chime') { R_chime = !R_chime; lsSet('classgame-chime', R_chime ? null : 'off'); bzRender(); }
});
$('buzz').addEventListener('change', async e => {
  const inp = e.target.closest('[data-bzfile]'); if (!inp || !inp.files[0]) return;
  try {
    const b = JSON.parse(await inp.files[0].text());
    if (!b || !b.key || !b.key.email || !b.key.password) throw new Error('bad');
    await signInWithEmailAndPassword(auth, b.key.email, b.key.password);
    lsSet('cg-teacher-key', JSON.stringify(b.key));
    turnOn(lsGet(BZKEY));
  } catch (err) { alert("That file didn't work. Use the backup file you downloaded from Hall Pass."); }
});

window.BZ = {
  render: bzRender, served,
  newGame() { end(); },
  end,
  resume() { const c = lsGet(BZKEY); if (c && buzzAllowed()) turnOn(c); else bzRender(); },
  teamsChanged() { if (R) updateDoc(roomRef(R.code), { teams: teamList() }).catch(() => {}); }
};
// The module loads after the game script; pick up a game that's already on screen.
if (!$('game').hidden) BZ.resume();

</script>
</body>
</html>
